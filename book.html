<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book your maintenance visit</title>
<meta name="theme-color" content="#0d1d38">
<link rel="icon" href="icon-192.png">
<style>
  body { margin: 0; background: #eef1f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #0f1b2d; }
  .c { max-width: 420px; margin: 0 auto; padding: 70px 24px; text-align: center; }
  .spin { width: 34px; height: 34px; margin: 0 auto 16px; border: 4px solid #cfdcec; border-top-color: #1f4e8c; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  h2 { margin: 0 0 10px; } p { line-height: 1.5; color: #344054; }
</style>
</head>
<body>
<div class="c" id="m"><div class="spin"></div><p>Loading your booking page…</p></div>
<script>
// Customer booking page. Shows the page from the PPH PM Portal script and sends the customer's choices back to it.
(function () {
  function parse(s, splitter) { var o = {}; s.replace(splitter, '').split('&').forEach(function (kv) { if (!kv) return; var i = kv.indexOf('='); o[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); }); return o; }
  var q = parse(location.search, /^\?/), h = parse(location.hash, /^#/);
  var API = h.api || '';
  var box = document.getElementById('m');
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function fail(t) { box.innerHTML = '<h2>Sorry</h2><p>' + esc(t) + '</p>'; }
  function post(b) {
    return fetch(API + (API.indexOf('?') < 0 ? '?' : '&') + 'app=1', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b), redirect: 'follow' })
      .then(function (r) { return r.json(); });
  }
  if (!API || !q.c || !q.t) { fail('This link is not complete. Please call us to book.'); return; }
  // the booking page calls google.script.run.X(...) — this sends those calls to the script instead
  window.__pmBook = function (fn, args, ok, bad) {
    post({ op: 'bookcall', fn: fn, args: args }).then(function (j) { if (j.ok) { if (ok) ok(j.result); } else if (bad) bad(new Error(j.error || 'Something went wrong')); },
      function () { if (bad) bad(new Error('Could not reach us. Check your signal and try again.')); });
  };
  var SHIM = '<meta name="viewport" content="width=device-width, initial-scale=1"><script>window.google={script:{get run(){return (function mk(ok,bad){return new Proxy({},{get:function(t,n){' +
    'if(n==="withSuccessHandler")return function(f){return mk(f,bad)};if(n==="withFailureHandler")return function(f){return mk(ok,f)};if(n==="withUserObject")return function(){return mk(ok,bad)};' +
    'return function(){window.__pmBook(String(n),[].slice.call(arguments),ok,bad)}}})})(null,null)}}};<\/script>';
  post({ op: 'bookpage', c: q.c, t: q.t, a: q.a || '', m: q.m || '' }).then(function (j) {
    if (!j.ok) { fail(j.error || 'Something went wrong. Please call us to book.'); return; }
    var html = String(j.html || '').replace(/<base[^>]*>/i, '');
    var keep = window.__pmBook;
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + SHIM; }) : SHIM + html;
    document.open(); document.write(html); document.close();
    window.__pmBook = keep;
  }, function () { fail('Could not reach us. Check your signal and try again, or call us to book.'); });
})();
</script>
</body>
</html>
